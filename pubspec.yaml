name: temple_run_tracker
description: A gamified GPS running tracker with 3D perspective track and AI Voice Coach.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0

flutter:
  uses-material-design: true
